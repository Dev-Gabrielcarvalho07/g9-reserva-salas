; =====================================================================
; G9 - Reserva de Salas | PgBouncer (pool de conexões)
; Backend (HikariCP) -> PgBouncer:6432 -> PostgreSQL:5432
; =====================================================================

[databases]
; nome lógico = destino real
g9_reservas = host=db port=5432 dbname=g9_reservas

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; ---------- Autenticação ----------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ---------- Pool ----------
; transaction: a conexão real só fica presa ao cliente durante a transação,
; depois volta pro pool -> poucas conexões reais atendem muitos clientes
pool_mode = transaction
; clientes que podem conectar no PgBouncer
max_client_conn = 200
; conexões reais por par (banco, usuário)
default_pool_size = 10
; mantém 2 conexões já abertas
min_pool_size = 2
; conexões extras em pico
reserve_pool_size = 5
reserve_pool_timeout = 3
; teto de conexões reais no Postgres (lá max_connections = 50)
max_db_connections = 30
; suporte a prepared statements em modo transaction
max_prepared_statements = 100

; ---------- Timeouts do pool ----------
; fecha conexão real ociosa (abaixo do idle_session_timeout do Postgres)
server_idle_timeout = 300
server_lifetime = 1800
; cliente desiste se esperar vaga no pool por 30s
query_wait_timeout = 30

; ---------- Admin / logs ----------
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
log_connections = 1
log_disconnections = 1
ignore_startup_parameters = extra_float_digits,options
