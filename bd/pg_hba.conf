# =====================================================================
# G9 - Reserva de Salas | pg_hba.conf
# Regras lidas de cima para baixo: a PRIMEIRA que casar é aplicada.
#
# Rede Docker "g9_net" = 172.28.0.0/24 (IPs fixos no docker-compose.yml)
#   172.28.0.10  db         (PostgreSQL)
#   172.28.0.20  pgbouncer  (pool de conexões)  <- ÚNICO cliente de rede liberado
#   172.28.0.30  backend    (Spring Boot)       <- fala com o banco SÓ via PgBouncer
#   172.28.0.40  frontend   (Nginx + SPA)       <- nunca acessa o banco
# =====================================================================

# TYPE  DATABASE      USER             ADDRESS            METHOD

# Socket local dentro do container (scripts de init e "docker exec ... psql")
local   all           all                                 scram-sha-256

# Aplicação e usuário de relatórios: só a partir do PgBouncer
host    g9_reservas   app_user         172.28.0.20/32     scram-sha-256
host    g9_reservas   relatorio_user   172.28.0.20/32     scram-sha-256

# Superusuário pela rede: bloqueado (administração só via socket local)
host    all           postgres         0.0.0.0/0          reject

# Qualquer outra origem/usuário/banco: bloqueado
host    all           all              0.0.0.0/0          reject
host    all           all              ::/0               reject
