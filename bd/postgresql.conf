# =====================================================================
# G9 - Reserva de Salas | postgresql.conf otimizado
# Carregado via: postgres -c config_file=/etc/postgresql/postgresql.conf
# =====================================================================

# ---------- Conexão e rede ----------
listen_addresses = '*'                 # escuta na rede interna do Docker (o pg_hba.conf filtra quem entra)
port = 5432
max_connections = 50                   # baixo de propósito: quem multiplexa os clientes é o PgBouncer
superuser_reserved_connections = 3

# ---------- Autenticação ----------
password_encryption = scram-sha-256    # senhas novas sempre gravadas em SCRAM (nunca md5)
authentication_timeout = 30s

# ---------- Memória (ambiente de laboratório) ----------
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# ---------- TIMEOUTS (requisito do trabalho) ----------
# Cancela qualquer comando que passe de 15s (o usuário da aplicação tem 5s via ALTER ROLE)
statement_timeout = 15s
# Derruba sessões que abriram transação (BEGIN) e ficaram paradas mais de 20s
# -> evita que uma reserva "abandonada" segure o lock da sala (SELECT FOR UPDATE)
idle_in_transaction_session_timeout = 20s
# Tempo máximo esperando um lock antes de desistir
lock_timeout = 10s
# Encerra sessões totalmente ociosas (sem transação) depois de 10 min
idle_session_timeout = 10min

# ---------- Logs ----------
log_destination = 'stderr'             # aparece no "docker compose logs db"
log_line_prefix = '%m [%p] %u@%d from %h '
log_connections = on
log_disconnections = on
log_statement = 'ddl'                  # registra CREATE/ALTER/DROP
log_min_duration_statement = 1000      # loga queries que demoram mais de 1s
log_lock_waits = on                    # loga quando alguém espera lock (útil na demo de concorrência)

# ---------- Localização ----------
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.portuguese'
